# Docker Compose for Crypto Price Prediction ML System
version: '3.8'

services:
  # Flask API Service
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: crypto-ml-api
    ports:
      - "5000:5000"
    environment:
      - APP_ENV=production
      - API_HOST=0.0.0.0
      - API_PORT=5000
      - API_DEBUG=false
      - PRICE_DATA_SOURCE=api
      - NEWS_MODEL_TYPE=mock
    volumes:
      - ../models/artifacts:/app/models/artifacts
      - ../data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # MLflow Server (Optional - for experiment tracking)
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.9.2
    container_name: crypto-mlflow
    ports:
      - "5001:5000"
    environment:
      - MLFLOW_BACKEND_STORE_URI=sqlite:///mlflow.db
      - MLFLOW_DEFAULT_ARTIFACT_ROOT=/mlflow/artifacts
    volumes:
      - mlflow-data:/mlflow
    command: mlflow server --host 0.0.0.0 --port 5000
    restart: unless-stopped
    profiles:
      - mlflow

volumes:
  mlflow-data:
